name: Release agent-wallet bundle

on:
  push:
    tags:
      - 'agent-wallet-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0) — used when not triggered by tag'
        type: string
        required: true
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish portable agent-wallet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#agent-wallet-v}"
          else
            TAG="agent-wallet-v${{ inputs.version }}"
            VERSION="${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          pnpm nx test hive-auth
          pnpm nx test agent-wallet
          pnpm nx test auth-api

      - name: Build production bundle
        run: pnpm exec nx run agent-wallet:build --skip-nx-cache

      - name: Prune production package metadata
        run: |
          pnpm exec nx run agent-wallet:prune-lockfile --skip-nx-cache
          node scripts/sync-pruned-package-lock.cjs --app agent-wallet

      - name: E2E tests
        run: pnpm nx e2e agent-wallet-e2e

      - name: Verify bundle dependencies
        run: pnpm check:bundle-deps -- --app agent-wallet

      - name: Smoke portable install in empty directory
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          cp dist/apps/agent-wallet/main.js "$SMOKE_DIR/main.js"
          cp dist/apps/agent-wallet/package.json "$SMOKE_DIR/package.json"
          cp dist/apps/agent-wallet/pnpm-lock.yaml "$SMOKE_DIR/pnpm-lock.yaml"
          cp apps/agent-wallet/scripts/install-prod-deps.sh "$SMOKE_DIR/install.sh"
          chmod +x "$SMOKE_DIR/install.sh"
          cd "$SMOKE_DIR"
          ./install.sh
          AGENT_WALLET_BEARER_TOKEN=ci-smoke-token-min-16-chars \
          AGENT_WALLET_NO_PERSIST=true \
          AGENT_WALLET_DATA_DIR="$SMOKE_DIR/data" \
          HOST=127.0.0.1 \
          PORT=7500 \
          node main.js &
          PID=$!
          OK=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7500/agent-wallet/health >/dev/null; then
              OK=1
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo 'portable smoke run failed: health endpoint did not respond'
            exit 1
          fi
          echo 'portable smoke run: OK'

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/apps/agent-wallet/main.js release/main.js
          cp dist/apps/agent-wallet/package.json release/package.json
          cp dist/apps/agent-wallet/pnpm-lock.yaml release/pnpm-lock.yaml
          cp apps/agent-wallet/scripts/install-prod-deps.sh release/install.sh
          cp apps/agent-wallet/scripts/install-prod-deps.ps1 release/install.ps1
          (cd release && sha256sum main.js package.json pnpm-lock.yaml install.sh install.ps1 > SHA256SUMS)
          cat > release-notes.md <<EOF
          ## agent-wallet ${{ steps.version.outputs.version }}

          Portable Node.js daemon: HAS session, local-key signing, Waivio JWT auth, IPFS upload via MCP.

          **Requirements:** Node.js 20+, pnpm (corepack enable)

          ### Install

          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/agent-wallet-portable.tar.gz
          tar xzf agent-wallet-portable.tar.gz
          cd agent-wallet-portable
          ./install.sh
          node main.js
          \`\`\`

          Bearer token is written to \`~/.odl/agent-wallet.token\` on first start.

          Skills: [hive-has-agent-wallet](https://github.com/Waiviogit/skills/blob/master/odl/hive-has-agent-wallet/SKILL.md), [ipfs-image-upload](https://github.com/Waiviogit/skills/blob/master/odl/ipfs-image-upload/SKILL.md)
          EOF
          tar czf release/agent-wallet-portable.tar.gz -C release main.js package.json pnpm-lock.yaml install.sh install.ps1 SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=(
            "${{ steps.version.outputs.tag }}"
            release/agent-wallet-portable.tar.gz
            release/SHA256SUMS
            --title "agent-wallet ${{ steps.version.outputs.version }}"
            --notes-file release-notes.md
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
