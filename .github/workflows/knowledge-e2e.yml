name: Knowledge API E2E

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  knowledge-e2e:
    name: knowledge-api MCP E2E
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'knowledge-e2e')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: odl
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: odl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KNOWLEDGE_API_PORT: '7400'
      PORT: '7400'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # migrate / knowledge:reindex use tsx --env-file=.env; POSTGRES_* come from job env above.
      - name: Create empty .env for CLI scripts
        run: touch .env

      - name: Sync ODL skills catalog
        run: pnpm sync:odl-skills

      - name: Migrate, reindex, and E2E
        run: pnpm e2e:knowledge-api
